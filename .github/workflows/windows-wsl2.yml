---
name: Windows WSL2

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.25.7
  WSLENV: GITHUB_WORKSPACE/p

jobs:
  short-test:
    name: Short test on Windows + WSL2
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup WSL2
        uses: vedantmgoyal9/setup-wsl2@main

      - name: Verify WSL2 environment
        shell: wsl-run {0}
        run: |
          set -euxo pipefail
          uname -a
          cat /etc/os-release
          git --version

      - name: Setup Go and Task
        shell: wsl-run {0}
        run: |
          set -euxo pipefail
          cd "$(wslpath "$GITHUB_WORKSPACE")"
          git config --global --add safe.directory "$(pwd)"

          if ! command -v wget >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget ca-certificates
          fi

          if ! command -v tar >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y tar
          fi

          rm -rf "$HOME/.local/go"
          mkdir -p "$HOME/.local"
          wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -O /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C "$HOME/.local"
          export PATH="$HOME/.local/go/bin:$PATH"

          go version
          go generate -x
          bin/task --version
        working-directory: .

      - name: Initialize project
        shell: wsl-run {0}
        run: |
          set -euxo pipefail
          cd "$(wslpath "$GITHUB_WORKSPACE")"
          export PATH="$HOME/.local/go/bin:$PATH"
          bin/task init

      - name: Run short unit tests
        shell: wsl-run {0}
        run: |
          set -euxo pipefail
          cd "$(wslpath "$GITHUB_WORKSPACE")"
          export PATH="$HOME/.local/go/bin:$PATH"
          bin/task test-unit-short TEST_TIMEOUT=10m

      - name: Check working tree
        if: always()
        shell: wsl-run {0}
        run: |
          cd "$(wslpath "$GITHUB_WORKSPACE")"
          git status --untracked-files --ignored
          git diff --exit-code
