---
name: Windows WSL2

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: 1.25.7
  WSLENV: GITHUB_WORKSPACE/p

jobs:
  short-test:
    name: Short test on Windows + WSL2
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          lfs: false

      - name: Setup WSL2
        uses: Vampire/setup-wsl@v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2

      - name: Verify WSL2 environment
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          uname -a
          cat /etc/os-release
          git --version

      - name: Setup Go and Task
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$(pwd)"
          git config --global core.autocrlf false

          # Fork checkouts may not expose FerretDB's release tags to the runner.
          # Version generation uses `git describe`, so make the upstream tags explicit.
          if ! git describe --tags --always >/dev/null 2>&1; then
            git fetch --force --tags https://github.com/FerretDB/FerretDB.git
          fi
          git describe --tags --always

          if ! command -v wget >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wget ca-certificates
          fi

          rm -rf "$HOME/.local/go"
          mkdir -p "$HOME/.local"
          wget -q "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -O /tmp/go.tar.gz
          tar -xzf /tmp/go.tar.gz -C "$HOME/.local"
          export PATH="$HOME/.local/go/bin:$PATH"
          export GOPROXY="https://proxy.golang.org"
          export GOTOOLCHAIN=local

          go version
          (cd tools && go generate -x)
          bin/task --version

      - name: Initialize project
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          export PATH="$HOME/.local/go/bin:$PATH"
          export GOPROXY="https://proxy.golang.org"
          export GOTOOLCHAIN=local
          bin/task init

      - name: Run short unit tests
        shell: wsl-bash {0}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          export PATH="$HOME/.local/go/bin:$PATH"
          export GOPROXY="https://proxy.golang.org"
          export GOTOOLCHAIN=local
          bin/task test-unit-short TEST_TIMEOUT=10m

      - name: Check working tree
        if: always()
        shell: wsl-bash {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          git status --untracked-files --ignored
          git diff --exit-code
